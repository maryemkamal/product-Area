
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Products</h1>

    <div class="products-container">

        <div class="product">
            <img src="https://images.unsplash.com/photo-1600269452121-4f2416e55c28?w=400"
                 alt="Nike Shoes">

            <div class="info">
                <h3>Nike Shoes</h3>
                <p>Comfortable and stylish shoes for everyday use.</p>
                <h3>$120</h3>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400"
                 alt="Red Nike Shoes">

            <div class="info">
                <h3>Nike Air</h3>
                <p>Sporty shoes for your daily activities.</p>
                <h3>$100</h3>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>

        <div class="product">
            <img src="https://images.unsplash.com/photo-1495555961986-6d4c1ecb7be3?w=400"
                 alt="Casual Shoes">

            <div class="info">
                <h3>Casual Shoes</h3>
                <p>Simple and comfortable shoes for everyday use.</p>
                <h3>$90</h3>
                <button class="add-to-cart">Add to Cart</button>
            </div>
        </div>

    </div>

</body>
</html>
